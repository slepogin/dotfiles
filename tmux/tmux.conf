# ~/.config/tmux/tmux.conf — Ghostty + Claude Code, tmux 3.8+
# prefix = Ctrl-b · перечитать: prefix + r · начисто: tmux kill-server
# нужны: brew install fzf lazygit
#
#   prefix + *        плавающая панель с шеллом (встроено в 3.8)
#   prefix + | / -    сплит вправо / вниз
#   prefix + h j k l  ходить по панелям,  H J K L — менять размер
#   prefix + Tab      поиск окна,  Shift-Tab — поиск проекта (встроено)
#   prefix + Space    предыдущий проект
#   prefix + G        lazygit
#   prefix + x        закрыть панель

# ── terminal ───────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*ghostty*:RGB,xterm-256color:RGB"
set -s extended-keys on                       # Shift+Enter в Claude Code
set -as terminal-features "xterm*:extkeys,*ghostty*:extkeys"
set -g allow-passthrough on
set -g focus-events on
set -sg escape-time 10
set -g set-clipboard on

# ── behavior ───────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
setw -g aggressive-resize on
# название окна: в шелле — имя папки; у Claude Code и opencode — тема
# разговора из заголовка терминала (до 20 символов, без значка-спиннера);
# у остальных программ — имя программы. Claude Code виден как номер версии.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^-?(zsh|fish|bash|sh)$,#{pane_current_command}},#{b:pane_current_path},#{?#{m/r:^([0-9.]+|claude|opencode)$,#{pane_current_command}},#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#{?#{==:#{pane_current_command},opencode},opencode,claude},#{=/16/…:#{?#{m/r:^(В|К|С|О|У|И|А|Я) ,#{pane_title}},#{pane_title},#{s/^[^ -~] //:pane_title}}}},#{pane_current_command}}}'
set -g display-time 2000
set -g status-interval 5

# Claude звенит, когда ждёт тебя → 🔔 у окна, флаг ! в списке проектов
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# ── keys ───────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4

bind Space switch-client -l
bind G display-popup -w 90% -h 90% -d "#{pane_current_path}" -E lazygit

# колесо мыши в less/man/glow
bind -n WheelUpPane if -Ft= "#{mouse_any_flag}" "send -M" \
  "if -Ft= '#{alternate_on}' 'send -N3 Up' 'copy-mode -e; send -M'"
bind -n WheelDownPane if -Ft= "#{mouse_any_flag}" "send -M" \
  "if -Ft= '#{alternate_on}' 'send -N3 Down' 'send -M'"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded ✓"

# ── theme: Tomorrow Night, прозрачный ──────────────────────────
CT_BG="#282c34"
CT_SURFACE="#373b41"
CT_OVERLAY="#969896"
CT_TEXT="#c5c8c6"
CT_BLUE="#81a2be"
CT_MAUVE="#b294bb"
CT_PEACH="#f0c674"
CT_FAINT="#6b7078"         # неактивные окна
CT_SEP="#4b5059"           # точки-разделители

# две строки: [0] — линия, в которую вписаны проекты, [1] — окна и время
set -g status 2
set -g status-position bottom
set -g 'status-format[0]' "#[align=left fg=$CT_SURFACE]── 🍀 #{R:─,#{client_width}}#[align=absolute-centre default] #{S/t:#{?#{m:claude-*,#{session_name}},,#[range=session|#{session_id}]#{?session_alerts,#[fg=$CT_PEACH bg=default]#[fg=$CT_BG bg=$CT_PEACH bold]#{session_name}#[fg=$CT_PEACH bg=default nobold],#[fg=$CT_OVERLAY] #{session_name} }#[norange default] },#[range=session|#{session_id}]#[fg=$CT_SURFACE bg=default]#[fg=$CT_TEXT bg=$CT_SURFACE bold]#{session_name}#[fg=$CT_SURFACE bg=default nobold]#[norange default] }#[align=right fg=$CT_SURFACE]#{R:─,#{client_width}}"
# [1]: по центру — все проекты «таблетками»: текущий на серой подложке,
# жёлтый — там ждёт Claude. Слева 🍀 и окна
# текущего проекта, если их больше одного. Края таблеток — символы Nerd Font.
set -g 'status-format[1]' "#[align=absolute-centre list=on]#[list=left-marker]‹ #[list=right-marker] ›#[list=on]#{W/t:#[range=window|#{window_index}]#{T:window-status-format}#[norange default]#{?loop_last_flag,,#[fg=$CT_SEP]  ·  },#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange list=on default]#{?loop_last_flag,,#[fg=$CT_SEP]  ·  }}#[nolist]#[align=right]#{T:status-right}"

set -g status-style "bg=default,fg=$CT_TEXT"
set -g status-left-length 30
set -g status-right-length 60
set -g status-right "#[fg=$CT_PEACH,bold]#{?client_prefix,⌨ PREFIX  ,}#[fg=$CT_OVERLAY]%H:%M "

setw -g window-status-format "#{?window_bell_flag,🔔 #[fg=$CT_PEACH],#[fg=$CT_FAINT]}#W"
setw -g window-status-current-format "#[fg=$CT_BLUE]#W#{?window_zoomed_flag, 󰊓,}"

# панели: заголовок только у плавающих
set -g pane-border-status top-floating
set -g pane-border-format "#[fg=$CT_MAUVE] ✦ #{pane_title} "
set -g pane-border-style "fg=$CT_SURFACE"
set -g pane-active-border-style "fg=$CT_MAUVE"
set -g popup-border-lines rounded
set -g popup-border-style "fg=$CT_MAUVE"

set -g message-style "bg=$CT_PEACH,fg=$CT_BG,bold"
setw -g mode-style "bg=$CT_SURFACE,fg=$CT_TEXT"
